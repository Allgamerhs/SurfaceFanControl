name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build analyzed projects
        shell: pwsh
        run: |
          dotnet restore src/SurfaceProFanControl/SurfaceProFanControl.csproj
          dotnet build src/SurfaceProFanControl/SurfaceProFanControl.csproj -c Release -p:DistributionFlavor=Portable --no-restore
          dotnet build tools/I2EcFanTest/I2EcFanTest.csproj -c Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@v4
